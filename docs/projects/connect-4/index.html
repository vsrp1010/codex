<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect 4</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">Browser game</p>
          <h1>Connect 4</h1>
          <p class="subhead">Configure the board, pick players and colors, then drop coins to connect four.</p>
        </div>
        <div class="legend" id="legend"></div>
      </header>

      <section class="panel">
        <div class="controls">
          <div class="control-group">
            <label for="rows">Rows</label>
            <input id="rows" type="number" min="4" max="12" value="6" />
          </div>
          <div class="control-group">
            <label for="cols">Columns</label>
            <input id="cols" type="number" min="4" max="12" value="7" />
          </div>
          <div class="control-group">
            <label for="players">Players</label>
            <input id="players" type="number" min="2" max="6" value="2" />
          </div>
        </div>
        <div class="player-config" id="playerConfig"></div>
        <div class="actions">
          <button id="apply">Apply Settings</button>
          <button id="restart" class="ghost">Restart Game</button>
        </div>
      </section>

      <section class="board-wrap">
        <div class="turn" id="status">Ready to play.</div>
        <div class="history">
          <div class="history-title">Move History</div>
          <ol id="historyList"></ol>
        </div>
        <div class="drop-row" id="dropRow"></div>
        <div class="board" id="board"></div>
      </section>
    </main>

    <div class="splash hidden" id="splash">
      <div class="splash-card">
        <h2 id="splashTitle">Player 1 Wins</h2>
        <p id="splashText">Game over. Nice connect four.</p>
        <button id="playAgain">Play Again</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
