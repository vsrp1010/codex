<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A dashboard for projects in the codex repository.">
    <title>Codex Projects</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">Codex repository</p>
        <h1>Projects</h1>
        <p class="intro">Browse the experiments, games, and applications available in this workspace.</p>
      </header>

      <section aria-labelledby="projects-heading">
        <div class="section-heading">
          <h2 id="projects-heading">Available projects</h2>
          <p id="project-count" aria-live="polite"></p>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">Loading projects…</p>
        <div id="project-list" class="project-list" hidden></div>
      </section>
    </main>
  </body>
</html>
